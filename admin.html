<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Zefiro di Oksi</title>
  <meta name="description" content="Area admin privata di Zefiro di Oksi: statistiche del sito, gestione contenuti e galleria." />
  <link rel="icon" type="image/png" href="images/favicon-rose.png" />
  <meta name="theme-color" content="#111827" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <section id="adm-login">
    <form id="adm-login-form" class="adm-login-card" autocomplete="on">
      <h1>
        <img src="images/favicon-rose.png" alt="" />
        Zefiro di Oksi · admin
      </h1>
      <p>Inserisci la password per accedere alle statistiche e ai contenuti del sito.</p>
      <input id="adm-pw" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="primary">Entra</button>
      <p id="adm-err"></p>
      <p class="adm-hint">
        Password di default: <code>zefiro2026</code><br>
        Cambiala dopo il primo accesso (sezione Impostazioni).
      </p>
    </form>
  </section>

  <!-- DASHBOARD -->
  <div id="adm-shell" hidden>

    <!-- SIDEBAR -->
    <aside class="adm-sidebar">
      <div class="adm-sidebar-brand">
        <img src="images/favicon-rose.png" alt="" />
        <div>
          <strong>Zefiro di Oksi</strong>
          <small>area admin</small>
        </div>
      </div>

      <ul class="adm-nav">
        <li>
          <a href="#analytics" class="adm-side-link is-active" data-section="analytics">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-7"/></svg>
            Analytics
          </a>
        </li>
        <li>
          <a href="#content" class="adm-side-link" data-section="content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Contenuti &amp; Galleria
          </a>
        </li>
        <li>
          <a href="#settings" class="adm-side-link" data-section="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Impostazioni
          </a>
        </li>
        <li>
          <a href="#help" class="adm-side-link" data-section="help">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Aiuto
          </a>
        </li>
      </ul>

      <div class="adm-sidebar-foot">
        <a href="index.html" style="text-decoration:none;">
          <button type="button" title="Vai al sito pubblico">↗ Torna al sito</button>
        </a>
        <button type="button" id="adm-logout" title="Esci">⎋ Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="adm-main">
      <header class="adm-main-header">
        <h2 id="adm-section-title">Analytics</h2>
      </header>
      <div id="adm-main">
        <!-- popolato da js/admin/main.js -->
      </div>
    </main>

  </div>

  <script src="js/i18n.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/admin/storage.js"></script>
  <script src="js/admin/analytics.js"></script>
  <script src="js/admin/editor.js"></script>
  <script src="js/admin/main.js"></script>
</body>
</html>
